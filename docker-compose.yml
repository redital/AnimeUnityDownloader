services:
  anime_unity_downloader:
    container_name: AnimeUnity-Downloader
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_PORT=${SERVICE_PORT:-5000}
      - FLASK_APP=flask_app.py
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - FLASK_HOST=${FLASK_HOST:-0.0.0.0}
      - FLASK_PORT=${FLASK_PORT:-5000}
      - SSL_CONTEXT=${SSL_CONTEXT:-}
      - ANIMEUNITY_URL=${ANIMEUNITY_URL:-https://www.animeunity.to}
      - DOWNLOAD_ROOT=${DOWNLOAD_ROOT:-}
    ports:
      - "${HOST_PORT:-8222}:${FLASK_PORT:-5000}"
    restart: unless-stopped
    build: .
    pull_policy: build
    volumes:
      - ${MEDIA_DIRECTORY:-./Downloads}:/app/Downloads
